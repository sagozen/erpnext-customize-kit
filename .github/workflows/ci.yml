name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

concurrency:
  # Scheduled runs get their own group: the 07:00 UTC nightly and a push to
  # main share github.ref, and cancel-in-progress would let them kill each
  # other mid-run.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      plugin_e2e: ${{ steps.plan.outputs.plugin_e2e }}
      cli_remote_e2e: ${{ steps.plan.outputs.cli_remote_e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Detect test plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-test-plan.mjs

  test-matrix:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run core tests
        run: bun run test:core

      - name: Run plugin loader E2E
        if: needs.changes.outputs.plugin_e2e == 'true'
        run: bun run test:plugin-e2e

      - name: Build
        run: bun run build

      - name: Verify generated tracked outputs
        run: git diff --exit-code -- .agents .claude .codex .cursor plugin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pankit-dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Verify Node test matrix
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "test matrix passed"

  cli-remote-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli_remote_e2e == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run remote CLI E2E smoke
        run: bun run test:cli-remote-e2e
